<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber AI - High Performance Player</title>
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { 
            background-color: #0f0f0f; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }
        .container { 
            max-width: 800px; 
            margin: 50px auto; 
        }
        .video-js { 
            margin: 20px auto; 
            border: 2px solid #00ff00; 
            box-shadow: 0 0 20px rgba(0,255,0,0.2); 
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>پلەبەری پەخشی ڕاستەوخۆ</h1>
        
        <!-- خانەیەک بۆ دابنانی لینی m3u8 بە دەستی -->
        <div class="input-group">
            <input type="text" id="m3u8-input" placeholder="لینکە m3u8ـەکە لێرە دابنێ...">
            <button onclick="loadStream()">لێدان</button>
        </div>

        <p id="source-text">سووچ: هیچی نەبژاردووە</p>

        <video id="player" class="video-js vjs-default-skin vjs-16-9" controls preload="auto">
            <source id="video-source" src="" type="application/x-mpegURL">
        </video>
    </div>

    <!-- Video.js JS -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('player', {
            autoplay: false,
            fluid: true,
            html5: { vhs: { overrideNative: true, enableLowInitialPlaylist: true } }
        });

        function loadStream() {
            var url = document.getElementById('m3u8-input').value;
            if (url) {
                document.getElementById('source-text').innerText = "سووچ: " + url;
                player.src({ src: url, type: 'application/x-mpegURL' });
                player.load();
                player.play();
            } else {
                alert("تکایە لینکێک بنووسە!");
            }
        }
        
        // ڕێگری لە پچڕان: ئەگەر هەڵە ڕوویدا دووبارە پەیوەندی دەکاتەوە
        player.on('error', function() {
            console.log("Reconnecting...");
            var url = document.getElementById('m3u8-input').value;
            if(url) {
                player.src({ src: url, type: 'application/x-mpegURL' });
                player.play();
            }
        });
    </script>
</body>
</html>
